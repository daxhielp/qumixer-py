[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qumidi"
version = "0.1.0.dev0"
description = "Python control library for Allen & Heath Qu series mixers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "pytest-cov", "hypothesis", "mypy", "ruff", "build"]
usb = ["mido", "python-rtmidi"]

[project.scripts]
qumidi = "qumidi.cli:main"

[tool.setuptools.packages.find]
include = ["qumidi*"]

[tool.setuptools.package-data]
qumidi = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["hardware: requires a physical Qu mixer (deselect with '-m \"not hardware\"')"]
filterwarnings = ["error"]
addopts = "--cov=qumidi.protocol --cov=qumidi.midi --cov=qumidi.state --cov-fail-under=90"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]
